<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A good life reaches beyond one pleasant moment</title><desc id="desc">Contrasts a short-lived purchase with ongoing connection, contribution and practice. A qualitative illustration without a formula or ranking of happiness.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#B65377" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#B65377" font-weight="700" text-anchor="start">A PLEASANT MOMENT IS ONLY ONE PART</text><text x="64" y="184" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">Relationships, purpose and conditions extend beyond an instant.</text><rect x="76" y="230" width="380" height="440" rx="22" fill="#F3E1E8" stroke="none" stroke-width="1"/><text x="106" y="282" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#A33B64" font-weight="700" text-anchor="start">A SINGLE MOMENT</text><rect x="151" y="331" width="220" height="160" rx="22" fill="#FFFFFF" stroke="#D3A9BD" stroke-width="3"/><rect x="193" y="351" width="136" height="111" rx="15" fill="#4E6585" stroke="none" stroke-width="1"/><path d="M247 473H274" fill="none" stroke="#B65377" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="266" y="548" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#7B395B" font-weight="700" text-anchor="middle">A NEW PURCHASE</text><text x="266" y="587" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6E6371" font-weight="400" text-anchor="middle">Delight matters.</text><rect x="503" y="230" width="631" height="440" rx="22" fill="#F8EAD4" stroke="none" stroke-width="1"/><text x="540" y="282" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#805D2D" font-weight="700" text-anchor="start">ACROSS ORDINARY DAYS</text><rect x="541" y="324" width="554" height="92" rx="15" fill="#FFFFFF" stroke="none" stroke-width="1"/><circle cx="589" cy="370" r="15" fill="#B65377" stroke="none" stroke-width="1"/><circle cx="630" cy="370" r="15" fill="#DDA46A" stroke="none" stroke-width="1"/><text x="676" y="369" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#825138" font-weight="700" text-anchor="start">CONNECTION</text><text x="676" y="397" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66717B" font-weight="400" text-anchor="start">Being understood</text><rect x="541" y="433" width="554" height="92" rx="15" fill="#FFFFFF" stroke="none" stroke-width="1"/><circle cx="589" cy="480" r="21" fill="#167E7A" stroke="none" stroke-width="1"/><text x="638" y="481" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#825138" font-weight="700" text-anchor="start">CONTRIBUTION</text><text x="638" y="508" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66717B" font-weight="400" text-anchor="start">Doing useful work</text><rect x="541" y="542" width="554" height="92" rx="15" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M572 583L587 598L613 566" fill="none" stroke="#A96B2A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="638" y="589" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#825138" font-weight="700" text-anchor="start">PRACTICE</text><text x="638" y="614" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66717B" font-weight="400" text-anchor="start">Returning to what matters</text><rect x="100" y="696" width="1000" height="84" rx="16" fill="#E8EEF1" stroke="none" stroke-width="1"/><text x="600" y="732" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#50637A" font-weight="700" text-anchor="middle">NOT A RECIPE · PEOPLE FACE DIFFERENT CIRCUMSTANCES</text><text x="600" y="758" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66717B" font-weight="400" text-anchor="middle">The book connects philosophical questions with psychological research.</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B65377" font-weight="700" text-anchor="end">BOOK 14 / 30</text></g></svg>
