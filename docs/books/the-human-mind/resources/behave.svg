<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">One sharp reply has influences across several timescales</title><desc id="desc">A sharp reply is presented alongside an interruption seconds earlier, poor sleep hours earlier, learned patterns over years and social demands. Explanations do not erase responsibility.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Open Sans,sans-serif" font-size="24" fill="#B35437" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Open Sans,sans-serif" font-size="39" fill="#B35437" font-weight="700" text-anchor="start">THE SAME ACTION HAS SEVERAL LEVELS OF CAUSE</text><text x="64" y="184" font-family="Open Sans,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">A single label cannot explain an individual's behavior.</text><rect x="70" y="229" width="430" height="161" rx="19" fill="#E1E9F2" stroke="none" stroke-width="1"/><text x="93" y="274" font-family="Open Sans,sans-serif" font-size="27" fill="#536783" font-weight="700" text-anchor="start">SECONDS BEFORE</text><text x="93" y="315" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">An interruption or perceived slight.</text><rect x="699" y="229" width="430" height="161" rx="19" fill="#EDE3F0" stroke="none" stroke-width="1"/><text x="722" y="274" font-family="Open Sans,sans-serif" font-size="27" fill="#7F6090" font-weight="700" text-anchor="start">HOURS BEFORE</text><text x="722" y="315" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Poor sleep, pressure or conflict.</text><rect x="70" y="602" width="430" height="152" rx="19" fill="#F5E5CF" stroke="none" stroke-width="1"/><text x="93" y="647" font-family="Open Sans,sans-serif" font-size="27" fill="#996737" font-weight="700" text-anchor="start">OVER YEARS</text><text x="93" y="688" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Habits, learning and development.</text><rect x="699" y="602" width="430" height="152" rx="19" fill="#DEEEE6" stroke="none" stroke-width="1"/><text x="722" y="647" font-family="Open Sans,sans-serif" font-size="27" fill="#307C67" font-weight="700" text-anchor="start">SOCIAL SETTING</text><text x="722" y="688" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Roles, resources and culture.</text><rect x="452" y="415" width="296" height="162" rx="24" fill="#B35437" stroke="none" stroke-width="1"/><text x="600" y="474" font-family="Open Sans,sans-serif" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="middle">ONE ACTION</text><text x="600" y="521" font-family="Open Sans,sans-serif" font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="middle">A SHARP REPLY</text><path d="M449 313L529 413 M750 313L670 413 M449 676L529 580 M750 676L670 580" fill="none" stroke="#B35437" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="529" cy="413" r="8" fill="#B35437" stroke="none" stroke-width="1"/><circle cx="670" cy="413" r="8" fill="#B35437" stroke="none" stroke-width="1"/><circle cx="529" cy="580" r="8" fill="#B35437" stroke="none" stroke-width="1"/><circle cx="670" cy="580" r="8" fill="#B35437" stroke="none" stroke-width="1"/><rect x="180" y="780" width="840" height="33" rx="9" fill="#F1DAD3" stroke="none" stroke-width="1"/><text x="600" y="803" font-family="Open Sans,sans-serif" font-size="21" fill="#90432F" font-weight="700" text-anchor="middle">UNDERSTANDING CAUSES DOES NOT ERASE ACCOUNTABILITY</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#B35437" font-weight="700" text-anchor="end">BOOK 28 / 30</text></g></svg>
