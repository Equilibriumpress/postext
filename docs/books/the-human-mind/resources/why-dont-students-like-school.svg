<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Prior knowledge makes an abstract fraction easier to reason about</title><desc id="desc">An unfamiliar three-quarters symbol compared with a four-part visual model. A worked example supplies missing prior knowledge before transfer.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Open Sans,sans-serif" font-size="24" fill="#167E7A" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Open Sans,sans-serif" font-size="39" fill="#167E7A" font-weight="700" text-anchor="start">FROM AN UNKNOWN SYMBOL TO A WORKED EXAMPLE</text><text x="64" y="184" font-family="Open Sans,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">First make the idea meaningful. Then increase the challenge.</text><rect x="67" y="232" width="473" height="413" rx="19" fill="#E9ECF3" stroke="none" stroke-width="1"/><text x="90" y="277" font-family="Open Sans,sans-serif" font-size="27" fill="#5B6889" font-weight="700" text-anchor="start">WITHOUT A CLEAR MODEL</text><text x="303" y="403" font-family="Open Sans,sans-serif" font-size="119" fill="#354968" font-weight="700" text-anchor="middle">3/4</text><rect x="176" y="475" width="259" height="83" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="305" y="528" font-family="Open Sans,sans-serif" font-size="27" fill="#68758C" font-weight="700" text-anchor="middle">WHAT IS THIS?</text><rect x="658" y="232" width="476" height="413" rx="19" fill="#E2F1E8" stroke="none" stroke-width="1"/><text x="681" y="277" font-family="Open Sans,sans-serif" font-size="27" fill="#167E7A" font-weight="700" text-anchor="start">WITH A WORKED EXAMPLE</text><rect x="704" y="351" width="81" height="92" rx="10" fill="#167E7A" stroke="none" stroke-width="3"/><rect x="798" y="351" width="81" height="92" rx="10" fill="#167E7A" stroke="none" stroke-width="3"/><rect x="892" y="351" width="81" height="92" rx="10" fill="#167E7A" stroke="none" stroke-width="3"/><rect x="986" y="351" width="81" height="92" rx="10" fill="#FFFFFF" stroke="#167E7A" stroke-width="3"/><text x="888" y="485" font-family="Open Sans,sans-serif" font-size="28" fill="#136E69" font-weight="700" text-anchor="middle">THREE OF FOUR</text><text x="888" y="522" font-family="Open Sans,sans-serif" font-size="28" fill="#136E69" font-weight="700" text-anchor="middle">EQUAL PARTS</text><path d="M548 430H638" fill="none" stroke="#167E7A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M626 421L638 430L626 439" fill="none" stroke="#167E7A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="113" y="684" width="974" height="92" rx="17" fill="#F5E1C8" stroke="none" stroke-width="1"/><text x="602" y="724" font-family="Open Sans,sans-serif" font-size="26" fill="#795A2A" font-weight="700" text-anchor="middle">NEXT: Can the learner explain six of eight equal parts?</text><text x="602" y="756" font-family="Open Sans,sans-serif" font-size="22" fill="#5C6879" font-weight="400" text-anchor="middle">Check understanding before removing the example.</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#167E7A" font-weight="700" text-anchor="end">BOOK 10 / 30</text></g></svg>
