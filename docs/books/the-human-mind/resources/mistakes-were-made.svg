<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Why admitting error hurts</title><desc id="desc">Self-justification rewrites the narrative around a poor choice. Independent schematic, not empirical quantitative data.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F5F1E9" stroke="none" stroke-width="2"/><text x="62" y="76" font-size="27" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="start">A VISUAL READING OF THE ARGUMENT</text><path d="M60 100 L1140 100" stroke="#B9C3CB" stroke-width="2" stroke-linecap="round" fill="none"/><text x="100" y="160" font-size="35" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="start">WHEN IDENTITY MEETS AN ERROR</text><rect x="416" y="215" width="368" height="135" rx="30" fill="#D7E7F2" stroke="none" stroke-width="2"/><text x="600" y="294" font-size="37" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="middle">DECISION</text><path d="M600 350 L323 475" stroke="#7652B2" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M600 350 L873 475" stroke="#7652B2" stroke-width="8" stroke-linecap="round" fill="none"/><rect x="104" y="484" width="435" height="172" rx="20" fill="#DDE9F3" stroke="none" stroke-width="2"/><text x="130" y="536" font-size="30" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="start">01</text><text x="130" y="588" font-size="26" font-weight="700" font-family="Open Sans,sans-serif" fill="#19283F" text-anchor="start">JUSTIFICATION</text><rect x="658" y="484" width="435" height="172" rx="20" fill="#E5D9EE" stroke="none" stroke-width="2"/><text x="684" y="536" font-size="30" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="start">02</text><text x="684" y="588" font-size="26" font-weight="700" font-family="Open Sans,sans-serif" fill="#19283F" text-anchor="start">CORRECTION</text><text x="600" y="756" font-size="29" font-weight="700" font-family="Open Sans,sans-serif" fill="#7652B2" text-anchor="middle">CORRECTION REQUIRES A NEW ACCOUNT</text><g data-editorial-footer="thm-11"><path d="M66 834H1134" stroke="#B8C6C9" stroke-width="2"/><text x="72" y="858" fill="#53657B" font-family="Open Sans,sans-serif" font-size="18" font-weight="600">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="858" text-anchor="end" fill="#7652B2" font-family="Open Sans,sans-serif" font-size="19" font-weight="700">BOOK 23 / 30</text></g></svg>
