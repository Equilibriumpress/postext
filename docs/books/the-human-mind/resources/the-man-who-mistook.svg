<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Seeing an object is not the same as recognizing it</title><desc id="desc">An illustrative dissociation drawn from Sacks's neurological portraits. Individual patients and cases differ. Conceptual editorial illustration, not experimental or quantitative evidence.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#B35437"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#B35437" opacity=".13"/></pattern><linearGradient id="mist" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#E2E9EE"/></linearGradient></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#B35437" stroke-width="2"/><text x="69" y="77" font-family="Open Sans,sans-serif" font-size="22" font-weight="700" fill="#B35437" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Open Sans,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">Seeing an object is not the same as recognizing it</text><path d="M69 164 L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="70" y="221" width="1045" height="509" rx="28" fill="#EFE8DF" stroke="none" stroke-width="1"/><text x="124" y="273" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#B35437" text-anchor="start">SEEING</text><text x="476" y="273" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#B35437" text-anchor="start">RECOGNIZING</text><text x="864" y="273" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#B35437" text-anchor="start">MEANING</text><rect x="114" y="308" width="259" height="289" rx="23" fill="#F9FAF8" stroke="none" stroke-width="1"/><path d="M160 479 Q239 409 319 480" stroke="#B35437" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M170 477 Q240 510 310 476" stroke="#B35437" stroke-width="9" fill="none" /><circle cx="237" cy="474" r="32" fill="#F0C1A0" stroke="none" stroke-width="1"/><circle cx="237" cy="474" r="13" fill="#B35437" stroke="none" stroke-width="1"/><text x="243" y="557" font-family="Open Sans,sans-serif" font-size="22" font-weight="600" fill="#58677F" text-anchor="middle">Visual information</text><rect x="458" y="308" width="264" height="289" rx="23" fill="#F9E6E3" stroke="none" stroke-width="1"/><circle cx="588" cy="428" r="75" fill="none" stroke="#B35437" stroke-width="11"/><path d="M540 382 L642 481" stroke="#B35437" stroke-width="13" fill="none" /><text x="589" y="555" font-family="Open Sans,sans-serif" font-size="19" font-weight="700" fill="#B35437" text-anchor="middle">Identification may fail</text><rect x="802" y="308" width="263" height="289" rx="23" fill="#E4E7F0" stroke="none" stroke-width="1"/><text x="933" y="402" font-family="Open Sans,sans-serif" font-size="39" font-weight="800" fill="#192B46" text-anchor="middle">WHO?</text><text x="933" y="452" font-family="Open Sans,sans-serif" font-size="39" font-weight="800" fill="#192B46" text-anchor="middle">WHAT?</text><text x="933" y="554" font-family="Open Sans,sans-serif" font-size="19" font-weight="600" fill="#58677F" text-anchor="middle">Meaning is affected</text><path d="M380 450 H446" stroke="#B35437" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M735 450 H786" stroke="#B35437" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="210" y="638" width="755" height="60" rx="16" fill="#F7D8BB" stroke="none" stroke-width="1"/><text x="585" y="677" font-family="Open Sans,sans-serif" font-size="23" font-weight="700" fill="#B35437" text-anchor="middle">A CLINICAL CASE DOES NOT DEFINE A PERSON</text><path d="M69 820 L1130 820" stroke="#C3CDD4" stroke-width="2" fill="none" /><text x="72" y="846" font-family="Open Sans,sans-serif" font-size="18" font-weight="600" fill="#58677F" text-anchor="start">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="846" font-family="Open Sans,sans-serif" font-size="16" font-weight="700" fill="#B35437" text-anchor="end">BOOK 29 / 30</text></svg>
