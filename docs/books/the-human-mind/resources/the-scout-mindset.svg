<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">From defending a belief to revising it</title><desc id="desc">A scout asks what evidence would change confidence. This sequence illustrates open-minded inquiry, not a scored test. Conceptual editorial illustration, not experimental or quantitative evidence.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#365BC5"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#365BC5" opacity=".13"/></pattern><linearGradient id="mist" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#E2E9EE"/></linearGradient></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#365BC5" stroke-width="2"/><text x="69" y="77" font-family="Open Sans,sans-serif" font-size="22" font-weight="700" fill="#365BC5" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Open Sans,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">From defending a belief to revising it</text><path d="M69 164 L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="66" y="226" width="310" height="491" rx="28" fill="#E6ECF6" stroke="none" stroke-width="1"/><rect x="448" y="226" width="317" height="491" rx="28" fill="#F7E9D1" stroke="none" stroke-width="1"/><rect x="834" y="226" width="301" height="491" rx="28" fill="#DEEDE8" stroke="none" stroke-width="1"/><text x="100" y="276" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#365BC5" text-anchor="start">1  THE CLAIM</text><text x="479" y="276" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#365BC5" text-anchor="start">2  EVIDENCE</text><text x="871" y="276" font-family="Open Sans,sans-serif" font-size="26" font-weight="700" fill="#365BC5" text-anchor="start">3  UPDATE</text><rect x="111" y="326" width="218" height="199" rx="20" fill="#fff" stroke="none" stroke-width="1"/><text x="220" y="386" font-family="Open Sans,sans-serif" font-size="32" font-weight="700" fill="#192B46" text-anchor="middle">“I AM</text><text x="220" y="430" font-family="Open Sans,sans-serif" font-size="40" font-weight="800" fill="#365BC5" text-anchor="middle">SURE”</text><path d="M140 464 L296 464" stroke="#B8C7DB" stroke-width="4" fill="none" /><text x="220" y="600" font-family="Open Sans,sans-serif" font-size="22" font-weight="500" fill="#58677F" text-anchor="middle">Start with a belief</text><rect x="486" y="334" width="241" height="97" rx="16" fill="#E2EBD9" stroke="none" stroke-width="1"/><text x="606" y="378" font-family="Open Sans,sans-serif" font-size="23" font-weight="700" fill="#30735C" text-anchor="middle">SUPPORTS</text><text x="606" y="411" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">Evidence A</text><rect x="486" y="455" width="241" height="97" rx="16" fill="#F2CFC4" stroke="none" stroke-width="1"/><text x="606" y="500" font-family="Open Sans,sans-serif" font-size="23" font-weight="700" fill="#365BC5" text-anchor="middle">CHALLENGES</text><text x="606" y="532" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">Evidence B</text><text x="607" y="620" font-family="Open Sans,sans-serif" font-size="22" font-weight="500" fill="#58677F" text-anchor="middle">Weigh both, not only</text><text x="607" y="650" font-family="Open Sans,sans-serif" font-size="22" font-weight="500" fill="#58677F" text-anchor="middle">the preferred one</text><path d="M877 569 L1101 569" stroke="#A4BEB0" stroke-width="13" fill="none" /><path d="M877 569 L977 569" stroke="#365BC5" stroke-width="13" fill="none" /><circle cx="977" cy="569" r="22" fill="#365BC5" stroke="#fff" stroke-width="6"/><text x="988" y="406" font-family="Open Sans,sans-serif" font-size="29" font-weight="700" fill="#192B46" text-anchor="middle">“I NOW</text><text x="988" y="450" font-family="Open Sans,sans-serif" font-size="34" font-weight="800" fill="#267867" text-anchor="middle">THINK…”</text><text x="989" y="630" font-family="Open Sans,sans-serif" font-size="22" font-weight="500" fill="#58677F" text-anchor="middle">Revised confidence</text><path d="M382 470 H440" stroke="#365BC5" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M771 470 H826" stroke="#365BC5" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M69 820 L1130 820" stroke="#C3CDD4" stroke-width="2" fill="none" /><text x="72" y="846" font-family="Open Sans,sans-serif" font-size="18" font-weight="600" fill="#58677F" text-anchor="start">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="846" font-family="Open Sans,sans-serif" font-size="16" font-weight="700" fill="#365BC5" text-anchor="end">BOOK 04 / 30</text></svg>
