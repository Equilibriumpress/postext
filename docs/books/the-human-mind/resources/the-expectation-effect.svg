<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Expectations shape perception</title><desc id="desc">Beliefs influence experience in context, without replacing material care. Independent schematic, not empirical quantitative data.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F5F1E9" stroke="none" stroke-width="2"/><text x="62" y="76" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A66E20" text-anchor="start">A VISUAL READING OF THE ARGUMENT</text><path d="M60 100 L1140 100" stroke="#B9C3CB" stroke-width="2" stroke-linecap="round" fill="none"/><text x="75" y="172" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A66E20" text-anchor="start">THE SAME INPUT, DIFFERENT INTERPRETATION</text><path d="M600 280L758 552L444 552Z" fill="#CEE4F0" stroke="#A66E20" stroke-width="15"/><path d="M105 415 L448 415" stroke="#A66E20" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M750 375 L1080 240" stroke="#DA866C" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M750 468 L1080 650" stroke="#6A9E9C" stroke-width="10" stroke-linecap="round" fill="none"/><text x="117" y="365" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A66E20" text-anchor="start">EXPECTATION</text><text x="600" y="600" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#A66E20" text-anchor="middle">INTERPRETATION</text><text x="855" y="264" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="start">EXPERIENCE</text><text x="867" y="669" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="start">UPDATE</text><g data-editorial-footer="thm-11"><path d="M66 834H1134" stroke="#B8C6C9" stroke-width="2"/><text x="72" y="858" fill="#53657B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="858" text-anchor="end" fill="#A66E20" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">BOOK 18 / 30</text></g></svg>
