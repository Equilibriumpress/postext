<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Attention changes what is available to remember</title><desc id="desc">A name introduced amid distractions may not be encoded clearly, whereas focused attention creates a better opportunity for later retrieval. Not a diagnostic claim.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Open Sans,sans-serif" font-size="24" fill="#167E7A" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Open Sans,sans-serif" font-size="39" fill="#167E7A" font-weight="700" text-anchor="start">WHEN A NAME IS FIRST HEARD</text><text x="64" y="184" font-family="Open Sans,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">A later lapse sometimes begins at the moment of introduction.</text><rect x="66" y="239" width="504" height="402" rx="19" fill="#E7EDF4" stroke="none" stroke-width="1"/><text x="89" y="284" font-family="Open Sans,sans-serif" font-size="27" fill="#47617E" font-weight="700" text-anchor="start">ATTENTION DIVIDED</text><rect x="630" y="239" width="504" height="402" rx="19" fill="#DFEFEA" stroke="none" stroke-width="1"/><text x="653" y="284" font-family="Open Sans,sans-serif" font-size="27" fill="#167E7A" font-weight="700" text-anchor="start">ATTENTION AVAILABLE</text><rect x="113" y="317" width="177" height="85" rx="12" fill="#F6E1C7" stroke="none" stroke-width="1"/><text x="201" y="372" font-family="Open Sans,sans-serif" font-size="31" fill="#26374B" font-weight="700" text-anchor="middle">&quot;ELENA&quot;</text><rect x="337" y="318" width="177" height="85" rx="12" fill="#F3CFD5" stroke="none" stroke-width="1"/><text x="425" y="366" font-family="Open Sans,sans-serif" font-size="25" fill="#9D4E69" font-weight="700" text-anchor="middle">2 ALERTS</text><path d="M290 359H333" fill="none" stroke="#B96A6A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12"/><text x="318" y="436" font-family="Open Sans,sans-serif" font-size="22" fill="#7B5C73" font-weight="700" text-anchor="middle">NAME + NOTIFICATIONS</text><path d="M290 461V525" fill="none" stroke="#AD7680" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 11"/><text x="290" y="577" font-family="Open Sans,sans-serif" font-size="26" fill="#7C6272" font-weight="700" text-anchor="middle">NO RELIABLE CUE</text><rect x="666" y="311" width="177" height="84" rx="11" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="753" y="366" font-family="Open Sans,sans-serif" font-size="30" fill="#1E615B" font-weight="700" text-anchor="middle">&quot;ELENA&quot;</text><path d="M843 350H892" fill="none" stroke="#167E7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M880 341L892 350L880 359" fill="none" stroke="#167E7A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="909" y="311" width="187" height="84" rx="11" fill="#F6E2C4" stroke="none" stroke-width="1"/><text x="1002" y="360" font-family="Open Sans,sans-serif" font-size="25" fill="#695127" font-weight="700" text-anchor="middle">PERSON +</text><text x="1002" y="384" font-family="Open Sans,sans-serif" font-size="23" fill="#695127" font-weight="600" text-anchor="middle">DETAIL</text><path d="M883 408V502" fill="none" stroke="#167E7A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M871 493L883 502L871 511" fill="none" stroke="#167E7A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="738" y="526" width="295" height="62" rx="13" fill="#167E7A" stroke="none" stroke-width="1"/><text x="885" y="565" font-family="Open Sans,sans-serif" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle">LATER: RETRIEVE</text><rect x="136" y="679" width="930" height="96" rx="18" fill="#F1E5CE" stroke="none" stroke-width="1"/><text x="601" y="721" font-family="Open Sans,sans-serif" font-size="25" fill="#795729" font-weight="650" text-anchor="middle">A missing name is not, by itself, evidence of illness.</text><text x="601" y="752" font-family="Open Sans,sans-serif" font-size="23" fill="#536174" font-weight="400" text-anchor="middle">Attention, encoding and retrieval are different questions.</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#167E7A" font-weight="700" text-anchor="end">BOOK 07 / 30</text></g></svg>
