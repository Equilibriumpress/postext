<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Perception is an ongoing, embodied loop</title><desc id="desc">One model of subjective experience uses prediction, incoming sensation and feedback. The scientific debate remains open. Conceptual editorial illustration, not experimental or quantitative evidence.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#B35437"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#B35437" opacity=".13"/></pattern><linearGradient id="mist" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#E2E9EE"/></linearGradient></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#B35437" stroke-width="2"/><text x="69" y="77" font-family="Open Sans,sans-serif" font-size="22" font-weight="700" fill="#B35437" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Open Sans,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">Perception is an ongoing, embodied loop</text><path d="M69 164 L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="70" y="219" width="1060" height="520" rx="30" fill="#E8ECEB" stroke="none" stroke-width="1"/><circle cx="315" cy="463" r="185" fill="#E3DFD8" stroke="none" stroke-width="1"/><path d="M172 600 Q192 503 274 498 L354 498 Q438 513 457 600 Z" fill="#C36D4E"/><path d="M260 448 Q315 489 370 448 L375 514 Q315 542 255 514 Z" fill="#EDBFA4"/><circle cx="315" cy="361" r="72" fill="#F0C8AF" stroke="none" stroke-width="1"/><path d="M263 362Q300 305 341 361" stroke="#B35437" stroke-width="9" fill="none" stroke-linecap="round"/><ci