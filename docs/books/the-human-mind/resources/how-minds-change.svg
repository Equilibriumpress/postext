<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A disagreement becomes a shared question</title><desc id="desc">Two people disagree about classroom phones, reveal different concerns, and formulate one question they can investigate. Listening does not guarantee agreement.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Open Sans,sans-serif" font-size="24" fill="#365BC5" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Open Sans,sans-serif" font-size="39" fill="#365BC5" font-weight="700" text-anchor="start">A DISAGREEMENT, TWO DIFFERENT CONCERNS</text><text x="64" y="184" font-family="Open Sans,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">Asking what matters creates room to examine evidence.</text><rect x="73" y="222" width="485" height="220" rx="19" fill="#DDEAF6" stroke="none" stroke-width="1"/><text x="96" y="267" font-family="Open Sans,sans-serif" font-size="27" fill="#254D99" font-weight="700" text-anchor="start">PERSON A · RESTRICT PHONES</text><text x="96" y="308" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Schoolwork is interrupted.</text><text x="96" y="339" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Concern: attention and learning.</text><rect x="641" y="222" width="485" height="220" rx="19" fill="#F1E1CC" stroke="none" stroke-width="1"/><text x="664" y="267" font-family="Open Sans,sans-serif" font-size="27" fill="#9C6527" font-weight="700" text-anchor="start">PERSON B · KEEP ACCESS</text><text x="664" y="308" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Families need a way to reach us.</text><text x="664" y="339" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Concern: safety and contact.</text><circle cx="560" cy="330" r="22" fill="#FFFFFF" stroke="#365BC5" stroke-width="4"/><text x="560" y="338" font-family="Open Sans,sans-serif" font-size="30" fill="#365BC5" font-weight="700" text-anchor="middle">≠</text><path d="M305 446V480H600 M885 446V480H600 M600 480V520" fill="none" stroke="#8C99AE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M588 511L600 520L588 529" fill="none" stroke="#8C99AE" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="136" y="538" width="930" height="128" rx="20" fill="#E5E6F4" stroke="none" stroke-width="1"/><text x="601" y="584" font-family="Open Sans,sans-serif" font-size="26" fill="#365BC5" font-weight="700" text-anchor="middle">ONE QUESTION BOTH SIDES CAN TEST</text><text x="601" y="624" font-family="Open Sans,sans-serif" font-size="29" fill="#26374B" font-weight="600" text-anchor="middle">When does phone access help or hinder students?</text><rect x="170" y="700" width="860" height="74" rx="16" fill="#DCEFE8" stroke="none" stroke-width="1"/><text x="600" y="747" font-family="Open Sans,sans-serif" font-size="27" fill="#267B72" font-weight="700" text-anchor="middle">Listen first · clarify the claim · check evidence</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#365BC5" font-weight="700" text-anchor="end">BOOK 05 / 30</text></g></svg>
