<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">When attention excludes the unexpected</title><desc id="desc">Selective attention creates blind spots without announcing them. Independent schematic, not empirical quantitative data.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F5F1E9" stroke="none" stroke-width="2"/><text x="62" y="76" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#365BC5" text-anchor="start">A VISUAL READING OF THE ARGUMENT</text><path d="M60 100 L1140 100" stroke="#B9C3CB" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="70" y="154" width="610" height="485" rx="30" fill="#E3EBFA" stroke="none" stroke-width="2"/><circle cx="373" cy="395" r="200" fill="#6A8BE1" opacity=".35"/><circle cx="373" cy="395" r="116" fill="#365BC5"/><text x="373" y="394" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#fff" text-anchor="middle">TASK TARGET</text><text x="373" y="432" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#FFF8D7" text-anchor="middle">IN FOCUS</text><circle cx="563" cy="224" r="40" fill="#D06E54" opacity=".85"/><text x="697" y="246" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="start">MISSED EVENT</text><text x="697" y="289" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#667890" text-anchor="start">OUTSIDE ATTENTION</text><rect x="713" y="333" width="404" height="140" rx="20" fill="#DDE9F3" stroke="none" stroke-width="2"/><text x="739" y="385" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#365BC5" text-anchor="start">01</text><text x="739" y="437" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="start">CONFIDENT MEMORY</text><rect x="713" y="497" width="404" height="140" rx="20" fill="#E5D9EE" stroke="none" stroke-width="2"/><text x="739" y="549" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#365BC5" text-anchor="start">02</text><text x="739" y="601" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="start">SECOND CHECK</text><text x="105" y="711" font-size="34" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#365BC5" text-anchor="start">NOTICING ≠ SEEING EVERYTHING</text><g data-editorial-footer="thm-11"><path d="M66 834H1134" stroke="#B8C6C9" stroke-width="2"/><text x="72" y="858" fill="#53657B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="858" text-anchor="end" fill="#365BC5" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">BOOK 02 / 30</text></g></svg>
