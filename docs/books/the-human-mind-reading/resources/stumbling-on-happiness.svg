<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Why tomorrow&#39;s happiness is hard to forecast</title><desc id="desc">The mind fills gaps in its pictures of future experience. Independent schematic, not empirical quantitative data.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F5F1E9" stroke="none" stroke-width="2"/><text x="62" y="76" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#B65377" text-anchor="start">A VISUAL READING OF THE ARGUMENT</text><path d="M60 100 L1140 100" stroke="#B9C3CB" stroke-width="2" stroke-linecap="round" fill="none"/><text x="90" y="165" font-size="32" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#B65377" text-anchor="start">PREDICTED FEELING vs EXPERIENCED DAY</text><path d="M105 650 L1110 650" stroke="#A1ABB8" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M105 650 L105 226" stroke="#A1ABB8" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M115 590Q335 160 555 260T1100 490" stroke="#B65377" stroke-width="16" fill="none"/><path d="M115 590Q320 400 540 415T1100 470" stroke="#D78B5A" stroke-width="16" stroke-dasharray="22 15" fill="none"/><text x="420" y="220" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#B65377" text-anchor="start">WHAT WE EXPECT</text><text x="695" y="435" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#B35E38" text-anchor="start">ACTUAL DAY</text><rect x="193" y="712" width="833" height="95" rx="20" fill="#E1E8EF" stroke="none" stroke-width="2"/><text x="600" y="769" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#19283F" text-anchor="middle">What the forecast omitted becomes part of the real day.</text><g data-editorial-footer="thm-11"><path d="M66 834H1134" stroke="#B8C6C9" stroke-width="2"/><text x="72" y="858" fill="#53657B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="858" text-anchor="end" fill="#B65377" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">BOOK 13 / 30</text></g></svg>
