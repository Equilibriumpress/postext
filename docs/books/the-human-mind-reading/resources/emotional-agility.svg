<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A feeling can lead to more than one response</title><desc id="desc">The two paths contrast immediate reaction with a values-led option, not guaranteed emotional outcomes. Illustrative editorial model, not measured scientific data.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#B65377"/></marker><pattern id="pin" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#B65377" opacity=".16"/></pattern></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#B65377" stroke-width="2"/><text x="69" y="77" font-family="Open Sans,sans-serif" font-size="22" font-weight="700" fill="#B65377" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Open Sans,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">A feeling can lead to more than one response</text><path d="M69 164L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="74" y="215" width="1054" height="523" rx="25" fill="#EEE4EA" stroke="none" stroke-width="1"/><circle cx="210" cy="425" r="107" fill="#E0BCD0" stroke="none" stroke-width="1"/><text x="210" y="409" font-family="Open Sans,sans-serif" font-size="27" font-weight="700" fill="#B65377" text-anchor="middle">A STRONG</text><text x="210" y="451" font-family="Open Sans,sans-serif" font-size="31" font-weight="800" fill="#B65377" text-anchor="middle">FEELING</text><path d="M317 414Q376 334 441 325" stroke="#B65377" stroke-width="6" fill="none" stroke-dasharray="13 9"/><path d="M317 459Q370 566 433 580" stroke="#B65377" stroke-width="8" fill="none" marker-end="url(#arr)"/><rect x="458" y="261" width="599" height="143" rx="22" fill="#E4DCE6" stroke="none" stroke-width="1"/><text x="487" y="302" font-family="Open Sans,sans-serif" font-size="27" font-weight="700" fill="#58677F" text-anchor="start">AUTOMATIC REACTION</text><text x="488" y="345" font-family="Open Sans,sans-serif" font-size="22" font-weight="500" fill="#58677F" text-anchor="start">Act before checking what matters</text><text x="997" y="348" font-family="Open Sans,sans-serif" font-size="50" font-weight="700" fill="#58677F" text-anchor="middle">?</text><rect x="450" y="468" width="182" height="205" rx="19" fill="#FDF9F7" stroke="none" stroke-width="1"/><rect x="658" y="468" width="182" height="205" rx="19" fill="#FDE5D4" stroke="none" stroke-width="1"/><rect x="867" y="468" width="190" height="205" rx="19" fill="#E2F0E8" stroke="none" stroke-width="1"/><text x="541" y="516" font-family="Open Sans,sans-serif" font-size="24" font-weight="700" fill="#B65377" text-anchor="middle">NOTICE</text><text x="541" y="563" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">Name the</text><text x="541" y="592" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">feeling</text><text x="749" y="516" font-family="Open Sans,sans-serif" font-size="24" font-weight="700" fill="#B65377" text-anchor="middle">VALUES</text><text x="749" y="563" font-family="Open Sans,sans-serif" font-size="19" font-weight="500" fill="#192B46" text-anchor="middle">What matters</text><text x="749" y="592" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="middle">to me?</text><text x="964" y="516" font-family="Open Sans,sans-serif" font-size="24" font-weight="700" fill="#B65377" text-anchor="middle">CHOOSE</text><text x="964" y="563" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">A deliberate</text><text x="964" y="592" font-family="Open Sans,sans-serif" font-size="21" font-weight="500" fill="#192B46" text-anchor="middle">next action</text><path d="M630 569H651" stroke="#B65377" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M840 569H860" stroke="#B65377" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="744" y="717" font-family="Open Sans,sans-serif" font-size="23" font-weight="700" fill="#B65377" text-anchor="middle">Emotion does not need to disappear before action</text><path d="M69 820L1130 820" stroke="#C3CDD4" stroke-width="2" fill="none" /><text x="72" y="846" font-family="Open Sans,sans-serif" font-size="18" font-weight="600" fill="#58677F" text-anchor="start">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="846" font-family="Open Sans,sans-serif" font-size="16" font-weight="700" fill="#B65377" text-anchor="end">BOOK 12 / 30</text></svg>
