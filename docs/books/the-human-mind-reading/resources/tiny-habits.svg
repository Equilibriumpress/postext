<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A tiny behavior follows a reliable prompt</title><desc id="desc">A concrete behavior design sequence: after switching on a kettle, water one plant, then acknowledge completion. Illustrative method, not guaranteed habit change.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#A66E20" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#A66E20" font-weight="700" text-anchor="start">A SMALL ROUTINE WITH A CLEAR BEGINNING</text><text x="64" y="184" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">BJ Fogg's method: place an easy action after an existing event.</text><rect x="69" y="232" width="331" height="389" rx="22" fill="#DDEAF3" stroke="none" stroke-width="1"/><text x="103" y="285" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#516789" font-weight="700" text-anchor="start">01 · AFTER I...</text><path d="M154 467H316V516H154Z" fill="none" stroke="#5C83A3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 466L201 384H275L298 466" fill="none" stroke="#5C83A3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 383V353 M251 382V353" fill="none" stroke="#5C83A3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><text x="234" y="573" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#28486B" font-weight="700" text-anchor="middle">SWITCH ON</text><text x="234" y="604" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#28486B" font-weight="700" text-anchor="middle">THE KETTLE</text><rect x="434" y="232" width="331" height="389" rx="22" fill="#F4E4C5" stroke="none" stroke-width="1"/><text x="465" y="285" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#92631D" font-weight="700" text-anchor="start">02 · I WILL...</text><path d="M545 515V403M630 515V403M529 408Q590 360 647 408" fill="none" stroke="#3B857A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="589" cy="385" r="31" fill="#65AB85" stroke="none" stroke-width="1"/><circle cx="564" cy="407" r="26" fill="#88C7A1" stroke="none" stroke-width="1"/><circle cx="620" cy="410" r="26" fill="#73B58D" stroke="none" stroke-width="1"/><rect x="545" y="516" width="85" height="42" rx="12" fill="#AD7246" stroke="none" stroke-width="1"/><text x="600" y="602" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#916020" font-weight="700" text-anchor="middle">WATER ONE</text><text x="600" y="630" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#916020" font-weight="700" text-anchor="middle">PLANT</text><rect x="799" y="232" width="331" height="389" rx="22" fill="#DBEFE7" stroke="none" stroke-width="1"/><text x="824" y="285" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#167E7A" font-weight="700" text-anchor="start">03 · I NOTICE...</text><path d="M964 339L984 387L1035 393L997 430L1009 480L962 450L915 480L925 431L888 394L939 386Z" fill="#9CD0BC" stroke="#167E7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="964" y="573" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#167E7A" font-weight="700" text-anchor="middle">A SMALL</text><text x="964" y="604" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#167E7A" font-weight="700" text-anchor="middle">SUCCESS</text><path d="M404 425H429 M771 425H794" fill="none" stroke="#A66E20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M417 416L429 425L417 434" fill="none" stroke="#A66E20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M782 416L794 425L782 434" fill="none" stroke="#A66E20" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="132" y="671" width="940" height="113" rx="19" fill="#EBE5F3" stroke="none" stroke-width="1"/><text x="601" y="716" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#755B92" font-weight="700" text-anchor="middle">PROMPT + ABILITY + MOTIVATION</text><text x="601" y="757" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4F5A6A" font-weight="400" text-anchor="middle">Keep the step small enough for an ordinary difficult day.</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#A66E20" font-weight="700" text-anchor="end">BOOK 17 / 30</text></g></svg>
