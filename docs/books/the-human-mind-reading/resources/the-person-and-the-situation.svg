<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">A person's behavior depends on the setting</title><desc id="desc">Contrasting scenes illustrate context effects, not a claim that everyone responds this way. Illustrative editorial model, not measured scientific data.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#7652B2"/></marker><pattern id="pin" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#7652B2" opacity=".16"/></pattern></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#7652B2" stroke-width="2"/><text x="69" y="77" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#7652B2" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">A person's behavior depends on the setting</text><path d="M69 164L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="65" y="209" width="1070" height="538" rx="28" fill="#E8E4F0" stroke="none" stroke-width="1"/><text x="600" y="262" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#7652B2" text-anchor="middle">SAME PERSON, DIFFERENT CONDITIONS</text><rect x="102" y="294" width="480" height="376" rx="26" fill="#F9E3D5" stroke="none" stroke-width="1"/><g transform="translate(315 476) scale(1.7)"><circle cx="0" cy="-49" r="26" fill="#7652B2" stroke="none" stroke-width="1"/><path d="M-46 62Q-48 -12 -18 -14Q0 -24 18 -14Q48 -12 46 62Z" stroke="#7652B2" stroke-width="1" fill="#7652B2" /></g><text x="127" y="336" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#7652B2" text-anchor="start">TIME PRESSURE</text><circle cx="501" cy="393" r="43" fill="#FFFBF4" stroke="#7652B2" stroke-width="6"/><path d="M501 369v26l18 16" stroke="#7652B2" stroke-width="6" fill="none" /><path d="M142 419l45 0M142 436l26 0" stroke="#7652B2" stroke-width="5" fill="none" /><text x="341" y="612" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#192B46" text-anchor="middle">Rushed response</text><rect x="619" y="294" width="480" height="376" rx="26" fill="#DBEBE5" stroke="none" stroke-width="1"/><g transform="translate(832 476) scale(1.7)"><circle cx="0" cy="-49" r="26" fill="#7652B2" stroke="none" stroke-width="1"/><path d="M-46 62Q-48 -12 -18 -14Q0 -24 18 -14Q48 -12 46 62Z" stroke="#7652B2" stroke-width="1" fill="#7652B2" /></g><text x="644" y="336" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#7652B2" text-anchor="start">TIME TO THINK</text><rect x="958" y="364" width="108" height="82" rx="12" fill="#FEFBF5" stroke="none" stroke-width="1"/><text x="1010" y="415" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#2C765B" text-anchor="middle">✓</text><text x="864" y="612" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#192B46" text-anchor="middle">Considered response</text><path d="M575 470H609" stroke="#7652B2" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="600" y="711" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#58677F" text-anchor="middle">Context helps explain variation without erasing responsibility</text><path d="M69 820L1130 820" stroke="#C3CDD4" stroke-width="2" fill="none" /><text x="72" y="846" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#58677F" text-anchor="start">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="846" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weigh