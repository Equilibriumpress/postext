<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Stress meaning and safe conditions are separate questions</title><desc id="desc">One difficult shift is considered through its personal meaning and actual conditions. Reframing does not replace adequate staffing, practical support or rest.</desc><rect x="0" y="0" width="1200" height="880" rx="34" fill="#F8F4EC" stroke="none" stroke-width="1"/><text x="56" y="70" font-family="Open Sans,sans-serif" font-size="24" fill="#B65377" font-weight="700" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><path d="M56 92H1144" fill="none" stroke="#BCC8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="143" font-family="Open Sans,sans-serif" font-size="39" fill="#B65377" font-weight="700" text-anchor="start">ONE DEMANDING SHIFT · TWO QUESTIONS</text><text x="64" y="184" font-family="Open Sans,sans-serif" font-size="24" fill="#526075" font-weight="400" text-anchor="start">Interpretation can change without removing the cause of risk.</text><rect x="83" y="231" width="1030" height="111" rx="20" fill="#F4DEE5" stroke="none" stroke-width="1"/><text x="600" y="283" font-family="Open Sans,sans-serif" font-size="34" fill="#9C4062" font-weight="700" text-anchor="middle">A DEMANDING HOSPITAL SHIFT</text><text x="600" y="318" font-family="Open Sans,sans-serif" font-size="24" fill="#756472" font-weight="400" text-anchor="middle">The demand is real.</text><path d="M601 342V392 M601 392H339V420 M601 392H865V420" fill="none" stroke="#B65377" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M327 411L339 420L327 429" fill="none" stroke="#B65377" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M853 411L865 420L853 429" fill="none" stroke="#B65377" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="83" y="437" width="493" height="227" rx="19" fill="#E9E2F1" stroke="none" stroke-width="1"/><text x="106" y="482" font-family="Open Sans,sans-serif" font-size="27" fill="#7D4F94" font-weight="700" text-anchor="start">01 · MEANING</text><text x="106" y="523" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Why is the work important?</text><text x="106" y="554" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">How will I approach the task?</text><text x="106" y="585" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Interpretation is one layer.</text><rect x="627" y="437" width="493" height="227" rx="19" fill="#F5E1D3" stroke="none" stroke-width="1"/><text x="650" y="482" font-family="Open Sans,sans-serif" font-size="27" fill="#A5573E" font-weight="700" text-anchor="start">02 · CONDITIONS</text><text x="650" y="523" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Is staffing adequate?</text><text x="650" y="554" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Is support or rest available?</text><text x="650" y="585" font-family="Open Sans,sans-serif" font-size="24" fill="#36435B" font-weight="400" text-anchor="start">Real hazards remain real.</text><rect x="135" y="699" width="925" height="81" rx="17" fill="#B65377" stroke="none" stroke-width="1"/><text x="598" y="739" font-family="Open Sans,sans-serif" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle">A new outlook cannot supply missing staff or rest.</text><text x="598" y="768" font-family="Open Sans,sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="middle">Reduce harmful demands, not just the words used for them.</text><g data-editorial-footer="thm-22"><path d="M66 818H1134" fill="none" stroke="#BAC6CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#637387" font-weight="600" text-anchor="start">INDEPENDENT EDITORIAL DIAGRAM · NOT MEASURED DATA</text><text x="1130" y="852" font-family="Open Sans,sans-serif" font-size="19" fill="#B65377" font-weight="700" text-anchor="end">BOOK 15 / 30</text></g></svg>
