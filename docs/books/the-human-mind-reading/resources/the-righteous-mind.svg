<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Why one question draws different moral answers</title><desc id="desc">Five moral lenses illustrate priorities, not fixed types of people. Moral-foundations theory is debated. Conceptual editorial illustration, not experimental or quantitative evidence.</desc><defs><marker id="arr" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M2 1L12 7L2 13" fill="#7652B2"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#7652B2" opacity=".13"/></pattern><linearGradient id="mist" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#E2E9EE"/></linearGradient></defs><rect x="0" y="0" width="1200" height="880" rx="35" fill="#F7F3EB" stroke="none" stroke-width="1"/><rect x="31" y="28" width="1138" height="824" rx="23" fill="none" stroke="#7652B2" stroke-width="2"/><text x="69" y="77" font-family="Open Sans,sans-serif" font-size="22" font-weight="700" fill="#7652B2" text-anchor="start">THE HUMAN MIND  /  VISUAL EXPLANATION</text><text x="69" y="139" font-family="Open Sans,sans-serif" font-size="33" font-weight="700" fill="#192B46" text-anchor="start">Why one question draws different moral answers</text><path d="M69 164 L1130 164" stroke="#C3CDD4" stroke-width="2" fill="none" /><rect x="69" y="213" width="1063" height="530" rx="28" fill="#EEEAF4" stroke="none" stroke-width="1"/><rect x="382" y="276" width="430" height="171" rx="26" fill="#FEF9EF" stroke="#7652B2" stroke-width="3"/><text x="595" y="329" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="middle">ONE SHARED QUESTION</text><text x="595" y="374" font-family="Open Sans,sans-serif" font-size="30" font-weight="700" fill="#192B46" text-anchor="middle">Who should receive</text><text x="595" y="413" font-family="Open Sans,sans-serif" font-size="30" font-weight="700" fill="#192B46" text-anchor="middle">limited help first?</text><path d="M386 334L350 334 M813 334L843 334 M505 447L257 495 M602 447L602 539 M708 447L967 496" stroke="#7652B2" stroke-width="5" fill="none" stroke-dasharray="11 9"/><rect x="105" y="265" width="249" height="110" rx="18" fill="#F5DFD8" stroke="none" stroke-width="1"/><text x="123" y="306" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="start">CARE</text><text x="123" y="342" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="start">Who is most vulnerable?</text><rect x="844" y="265" width="241" height="110" rx="18" fill="#DFEAE5" stroke="none" stroke-width="1"/><text x="862" y="306" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="start">FAIRNESS</text><text x="862" y="342" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="start">What rule is equal?</text><rect x="94" y="506" width="313" height="110" rx="18" fill="#FAE8C9" stroke="none" stroke-width="1"/><text x="112" y="547" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="start">LOYALTY</text><text x="112" y="583" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="start">Whom have we promised?</text><rect x="440" y="548" width="320" height="110" rx="18" fill="#DDDFF3" stroke="none" stroke-width="1"/><text x="458" y="589" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="start">AUTHORITY</text><text x="458" y="625" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="start">Who decides the process?</text><rect x="795" y="506" width="318" height="110" rx="18" fill="#E6DDF5" stroke="none" stroke-width="1"/><text x="813" y="547" font-family="Open Sans,sans-serif" font-size="25" font-weight="700" fill="#7652B2" text-anchor="start">LIBERTY</text><text x="813" y="583" font-family="Open Sans,sans-serif" font-size="20" font-weight="500" fill="#192B46" text-anchor="start">Who keeps a choice?</text><text x="601" y="723" font-family="Open Sans,sans-serif" font-size="24" font-weight="700" fill="#7652B2" text-anchor="middle">Different values can emphasize different concerns</text><path d="M69 820 L1130 820" stroke="#C3CDD4" stroke-width="2" fill="none" /><text x="72" y="846" font-family="Open Sans,sans-serif" font-size="18" font-weight="600" fill="#58677F" text-anchor="start">AN INDEPENDENT EDITORIAL INTERPRETATION</text><text x="1130" y="846" font-family="Open Sans,sans-serif" font-size="16" font-weight="700" fill="#7652B2" text-anchor="end">BOOK 24 / 30</text></svg>
