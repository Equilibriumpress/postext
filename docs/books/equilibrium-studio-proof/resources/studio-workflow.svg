<text x="148" y="145" font-size="17" fill="#e1e9e5">Markdown · SVG · GeoJSON</text>
<rect x="326" y="62" width="246" height="130" rx="14" fill="#304c74"/>
<text x="449" y="109" fill="#fff" font-weight="700">Postext</text>
<text x="449" y="145" font-size="17" fill="#e1e9ee">Browser layout</text>
